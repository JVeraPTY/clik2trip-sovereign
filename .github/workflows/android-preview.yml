name: Android preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Install pinned Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm evaluation:quality
      - run: pnpm evaluation:report
      - run: pnpm wdk:bundle
      - run: pnpm android:prebuild
      - name: Build standalone preview APK
        working-directory: apps/android/android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clik2trip-sovereign-preview-apk
          path: |
            apps/android/android/app/build/outputs/apk/release/app-release.apk
            evaluation/performance-report.json
            evaluation/quality/quality-report.json
          retention-days: 7
