name: Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm wdk:bundle
      - run: pnpm android:prebuild
      - name: Decode Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore=apps/android/android/app/sovereign-upload.jks

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty or unset."
            exit 1
          fi

          # Tolerate any wrapping the value picked up between the file and the
          # secret field. A newline in the middle is harmless; a stray variable
          # name or quote is not, and shows up as invalid base64 below.
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Paste only the value, without the ANDROID_KEYSTORE_BASE64= prefix and without quotes."
            exit 1
          fi

          if [ ! -s "$keystore" ]; then
            echo "::error::The decoded keystore is empty."
            exit 1
          fi

          # Opening it here turns a wrong password or alias into a named error
          # now, instead of an opaque Gradle signing failure ten minutes later.
          if ! keytool -list -keystore "$keystore" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore decoded but would not open. Check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS."
            exit 1
          fi

          echo "Keystore decoded and opened: $(wc -c < "$keystore") bytes"
      - name: Build signed APK
        working-directory: apps/android/android
        env:
          NODE_ENV: production
          SOVEREIGN_UPLOAD_STORE_FILE: sovereign-upload.jks
          SOVEREIGN_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SOVEREIGN_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SOVEREIGN_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Prepare release assets
        run: |
          cp apps/android/android/app/build/outputs/apk/release/app-release.apk clik2trip-sovereign.apk
          shasum -a 256 clik2trip-sovereign.apk > clik2trip-sovereign.apk.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            clik2trip-sovereign.apk
            clik2trip-sovereign.apk.sha256
