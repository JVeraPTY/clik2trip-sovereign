name: Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DEMO_VIDEO_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/clik2trip-sovereign-demo.mp4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Install pinned Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Validate final evaluation evidence
        run: |
          pnpm evaluation:quality:strict
          pnpm evaluation:report:strict
      - run: pnpm wdk:bundle
      - run: pnpm android:prebuild
      - name: Decode Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore=apps/android/android/app/sovereign-upload.jks

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty or unset."
            exit 1
          fi

          # Tolerate any wrapping the value picked up between the file and the
          # secret field. A newline in the middle is harmless; a stray variable
          # name or quote is not, and shows up as invalid base64 below.
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Paste only the value, without the ANDROID_KEYSTORE_BASE64= prefix and without quotes."
            exit 1
          fi

          if [ ! -s "$keystore" ]; then
            echo "::error::The decoded keystore is empty."
            exit 1
          fi

          # Opening it here turns a wrong password or alias into a named error
          # now, instead of an opaque Gradle signing failure ten minutes later.
          if ! keytool -list -keystore "$keystore" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore decoded but would not open. Check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS."
            exit 1
          fi

          # Importing a PKCS12 entry does not reliably validate a distinct key
          # password: some JDKs silently reuse the store password. Signing a
          # disposable JAR forces the private-key decryption that Gradle needs.
          verification_dir="$RUNNER_TEMP/signing-verification"
          mkdir -p "$verification_dir/empty"
          jar --create --file "$verification_dir/unsigned.jar" \
              -C "$verification_dir/empty" .
          if ! jarsigner \
              -keystore "$keystore" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              "$verification_dir/unsigned.jar" \
              "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The alias exists but its private key would not open. Check ANDROID_KEY_PASSWORD."
            exit 1
          fi

          echo "Keystore, alias, store password, and key password validated."
      - name: Build signed APK
        working-directory: apps/android/android
        env:
          NODE_ENV: production
          SOVEREIGN_UPLOAD_STORE_FILE: sovereign-upload.jks
          SOVEREIGN_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SOVEREIGN_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SOVEREIGN_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cp apps/android/android/app/build/outputs/apk/release/app-release.apk clik2trip-sovereign.apk
          apksigner verify --verbose clik2trip-sovereign.apk
          node tools/build-release-metadata.mjs
          cp evaluation/performance-report.json performance-report.json
          cp evaluation/quality/quality-report.json quality-report.json
          cp docs/assets/clik2trip-sovereign-demo.mp4 clik2trip-sovereign-demo.mp4
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          name: Clik2Trip Sovereign ${{ github.ref_name }}
          body_path: release-notes.md
          make_latest: true
          files: |
            clik2trip-sovereign.apk
            clik2trip-sovereign.apk.sha256
            clik2trip-sovereign-demo.mp4
            performance-report.json
            quality-report.json
            release-manifest.json
