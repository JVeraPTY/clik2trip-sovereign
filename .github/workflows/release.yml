name: Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm wdk:bundle
      - run: pnpm android:prebuild
      - name: Decode Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/android/android/app/sovereign-upload.jks
      - name: Build signed APK
        working-directory: apps/android/android
        env:
          NODE_ENV: production
          SOVEREIGN_UPLOAD_STORE_FILE: sovereign-upload.jks
          SOVEREIGN_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SOVEREIGN_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SOVEREIGN_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Prepare release assets
        run: |
          cp apps/android/android/app/build/outputs/apk/release/app-release.apk clik2trip-sovereign.apk
          shasum -a 256 clik2trip-sovereign.apk > clik2trip-sovereign.apk.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            clik2trip-sovereign.apk
            clik2trip-sovereign.apk.sha256
